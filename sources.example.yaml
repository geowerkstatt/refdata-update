# ch.swisstopo.hoheitsgrenze-landesvermessung, Geobasisdaten ID 39
- source: https://data.geo.admin.ch/ch.swisstopo.hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung_2056.xtf.zip
  extract:
    - entry: hoheitsgrenze-landesvermessung_2056.xtf
      destination: dmav_V1_1/refdata/hoheitsgrenze-landesvermessung_2056.xtf

# ch.swisstopo-vd.ortschaftenverzeichnis_plz, Geobasisdaten ID 181, about 380 MB unpacked
- source: https://data.geo.admin.ch/ch.swisstopo-vd.ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz_2056.xtf.zip
  extract:
    - entry: AMTOVZ_INTERLIS24/OfficialIndexOfLocalities_V1_0.xtf
      destination: dmav_V1_1/refdata/OfficialIndexOfLocalities_V1_0.xtf

